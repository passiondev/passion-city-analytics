version: 2

sources:
  - name: rock
    description: >
      Raw data landed from Rock RMS (church management system), loaded via
      a scheduled extract from Rock's underlying SQL Server database
      (Cloud SQL for SQL Server, Web Edition — no CDC available, so this
      is timestamp-based polling, not change-data-capture). Runs on a
      schedule via Cloud Scheduler + Cloud Run Job. Bronze layer —
      unmodified as ingested, no business logic applied.
    database: "{{ target.project }}"
    schema: bronze
    tables:
      - name: rock_attendance
        description: >
          Raw extract of Rock's Attendance table. One row per person per
          occurrence, including people who were only scheduled or RSVP'd.
        loaded_at_field: _loaded_at
        columns:
          - name: Id
            description: Rock's internal ID for the attendance record.
            tests:
              - unique
              - not_null
          - name: OccurrenceId
            description: Foreign key to AttendanceOccurrence.
          - name: PersonAliasId
            description: Foreign key to PersonAlias.
          - name: DidAttend
            description: Whether the person actually attended.
          - name: _loaded_at
            description: Ingestion metadata, when this row was loaded into bronze.

      - name: rock_attendance_occurrences
        description: >
          Raw extract of Rock's AttendanceOccurrence table. One row per
          occurrence of a group meeting or service.
        loaded_at_field: _loaded_at
        columns:
          - name: Id
            description: Rock's internal ID for the occurrence.
            tests:
              - unique
              - not_null
          - name: OccurrenceDate
            description: Date of the occurrence.
          - name: _loaded_at
            description: Ingestion metadata, when this row was loaded into bronze.

      - name: rock_people
        description: >
          Raw extract of Rock's `dbo.Person` table. One row per person
          record in Rock (includes both active and inactive/deceased
          records — filtering happens downstream in staging). Note: hard
          deletes on the Rock side are not automatically reflected here;
          see README for reconciliation notes.
        loaded_at_field: _loaded_at
        freshness:
          warn_after: {count: 30, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: Id
            description: Rock's internal surrogate integer ID for the person record.
            tests:
              - unique
              - not_null
          - name: Guid
            description: Rock's globally unique identifier for the person record, stable across environments/exports.
          - name: RecordTypeValueId
            description: >
              Foreign key to Rock's DefinedValue table (DefinedType =
              "Record Type"). Distinguishes person records from business/
              group records that also live in the Person table.
          - name: RecordStatusValueId
            description: >
              Foreign key to DefinedValue (DefinedType = "Record Status").
              Indicates Active / Inactive / Pending.
          - name: ConnectionStatusValueId
            description: >
              Foreign key to DefinedValue (DefinedType = "Connection
              Status"). Indicates how connected the person is to the
              organization (e.g. Member, Attendee, Visitor).
          - name: IsDeceased
            description: Boolean flag set when the person has been marked deceased in Rock.
          - name: FirstName
            description: Person's first name as entered in Rock.
          - name: NickName
            description: Preferred/display name, defaults to FirstName if not set separately.
          - name: LastName
            description: Person's last name as entered in Rock.
          - name: BirthDay
            description: Day-of-month component of birth date (nullable, Rock stores DOB as separate day/month/year fields).
          - name: BirthMonth
            description: Month component of birth date.
          - name: BirthYear
            description: Year component of birth date (nullable if age-restricted or unknown).
          - name: Gender
            description: Integer enum from Rock (0 = Unknown, 1 = Male, 2 = Female).
          - name: MaritalStatusValueId
            description: Foreign key to DefinedValue (DefinedType = "Marital Status").
          - name: Email
            description: Person's primary email address.
          - name: IsEmailActive
            description: Whether the email address is currently active/deliverable per Rock's bounce handling.
          - name: EmailPreference
            description: Integer enum for email communication preference (0 = Email Allowed, 1 = No Mass Emails, 2 = Do Not Email).
          - name: GivingId
            description: Identifier used by Rock to group individuals into a giving unit (often shared across a family).
          - name: PrimaryFamilyId
            description: Foreign key to the person's primary family group.
          - name: PrimaryCampusId
            description: Foreign key to the campus the person is primarily associated with.
          - name: CreatedDateTime
            description: Timestamp the record was created in Rock.
          - name: ModifiedDateTime
            description: Timestamp the record was last modified in Rock.
          - name: _loaded_at
            description: Ingestion metadata — timestamp this row was loaded into BigQuery bronze by the polling script.
          - name: _source_system
            description: Ingestion metadata — constant "rock_rms", useful once bronze holds multiple source systems.

      - name: rock_groups
        description: >
          Raw extract of Rock's `dbo.Group` table. Covers families, small
          groups, serving teams, and security roles — Group is a general-
          purpose entity in Rock, distinguished by GroupTypeId. One row
          per group record, including inactive and archived groups.
        loaded_at_field: _loaded_at
        columns:
          - name: Id
            description: Rock's internal surrogate integer ID for the group record.
            tests:
              - unique
              - not_null
          - name: Guid
            description: Rock's stable GUID for the group, safe across environments/exports.
          - name: ParentGroupId
            description: Foreign key to this group's parent group, if nested in a hierarchy.
          - name: GroupTypeId
            description: Foreign key to GroupType — determines what kind of group this is (family, small group, serving team, security role, etc.).
          - name: CampusId
            description: Foreign key to the campus this group is associated with.
          - name: Name
            description: Display name of the group.
          - name: Description
            description: Free-text description of the group.
          - name: IsSecurityRole
            description: True if this "group" is actually a security role rather than a real group — Rock overloads the Group table for both.
          - name: IsActive
            description: Whether the group is currently active in Rock.
          - name: IsArchived
            description: Whether the group has been archived (soft-deleted) in Rock.
          - name: ArchivedDateTime
            description: Timestamp the group was archived, if applicable.
          - name: StatusValueId
            description: Foreign key to DefinedValue for the group's status, where applicable to the group type.
          - name: GroupAdministratorPersonAliasId
            description: Foreign key (via PersonAlias) to the person administering this group.
          - name: InactiveDateTime
            description: Timestamp the group was marked inactive, if applicable.
          - name: CreatedDateTime
            description: Timestamp the record was created in Rock.
          - name: ModifiedDateTime
            description: Timestamp the record was last modified in Rock.
          - name: _loaded_at
            description: Ingestion metadata — timestamp this row was loaded into BigQuery bronze.
          - name: _source_system
            description: Ingestion metadata — constant "rock_rms".

      - name: rock_connection_requests
        description: >
          Raw extract of Rock's ConnectionRequest table. One row per request
          a person has made to connect with an opportunity.
        loaded_at_field: _loaded_at
        columns:
          - name: Id
            description: Rock's internal ID for the connection request.
            tests:
              - unique
              - not_null
          - name: ConnectionOpportunityId
            description: Foreign key to the connection opportunity.
          - name: PersonAliasId
            description: Foreign key to PersonAlias for the requester.
          - name: ConnectionState
            description: Raw connection state code.
          - name: _loaded_at
            description: Ingestion metadata, when this row was loaded into bronze.
    
      - name: rock_group_members
        description: >
          Raw extract of Rock's GroupMember table. One row per person's
          membership in a group.
        loaded_at_field: _loaded_at
        columns:
          - name: Id
            description: Rock's internal ID for the membership.
            tests:
              - unique
              - not_null
          - name: GroupId
            description: Foreign key to the group.
          - name: PersonId
            description: Foreign key to the person.
          - name: GroupMemberStatus
            description: Raw membership status code.
          - name: _loaded_at
            description: Ingestion metadata, when this row was loaded into bronze.

      - name: rock_financial_accounts
        description: >
          Raw extract of Rock's FinancialAccount table. The chart of funds
          that gifts are recorded against.
        loaded_at_field: _loaded_at
        columns:
          - name: Id
            description: Rock's internal ID for the account.
            tests:
              - unique
              - not_null
          - name: ParentAccountId
            description: Foreign key to the parent account, if nested.
          - name: IsActive
            description: Raw active flag.
          - name: _loaded_at
            description: Ingestion metadata, when this row was loaded into bronze.
        
      - name: rock_financial_transactions
        description: >
          Raw extract of Rock's FinancialTransaction table. One row per
          transaction header. Dollar amounts are on the detail table.
        loaded_at_field: _loaded_at
        columns:
          - name: Id
            description: Rock's internal ID for the transaction.
            tests:
              - unique
              - not_null
          - name: TransactionDateTime
            description: Date and time of the transaction.
          - name: AuthorizedPersonAliasId
            description: Foreign key to PersonAlias for the giver.
          - name: _loaded_at
            description: Ingestion metadata, when this row was loaded into bronze.

      - name: rock_financial_transaction_details
        description: >
          Raw extract of Rock's FinancialTransactionDetail table. One row
          per fund a transaction was applied to, with the amounts.
        loaded_at_field: _loaded_at
        columns:
          - name: Id
            description: Rock's internal ID for the detail line.
            tests:
              - unique
              - not_null
          - name: TransactionId
            description: Foreign key to the transaction header.
          - name: AccountId
            description: Foreign key to the financial account (fund).
          - name: Amount
            description: Amount applied to the fund. Negative for refunds.
          - name: _loaded_at
            description: Ingestion metadata, when this row was loaded into bronze.

      - name: rock_person_aliases
        description: Raw extract of Rock's PersonAlias table. Bridges alias ids to person ids.
        loaded_at_field: _loaded_at
        columns:
          - name: Id
            description: Rock's internal ID for the alias.
            tests:
              - unique
              - not_null
          - name: PersonId
            description: The person the alias currently resolves to.
          - name: _loaded_at
            description: Ingestion metadata, when this row was loaded into bronze.

      - name: rock_defined_values
        description: Raw extract of Rock's DefinedValue table. The lookup behind every ...ValueId column.
        loaded_at_field: _loaded_at
        columns:
          - name: Id
            description: Rock's internal ID for the defined value.
            tests:
              - unique
              - not_null
          - name: DefinedTypeId
            description: The defined type (list) the value belongs to.
          - name: _loaded_at
            description: Ingestion metadata, when this row was loaded into bronze.

      - name: rock_group_types
        description: Raw extract of Rock's GroupType table. One row per kind of group.
        loaded_at_field: _loaded_at
        columns:
          - name: Id
            description: Rock's internal ID for the group type.
            tests:
              - unique
              - not_null
          - name: _loaded_at
            description: Ingestion metadata, when this row was loaded into bronze.

      - name: rock_campuses
        description: Raw extract of Rock's Campus table. One row per campus.
        loaded_at_field: _loaded_at
        columns:
          - name: Id
            description: Rock's internal ID for the campus.
            tests:
              - unique
              - not_null
          - name: _loaded_at
            description: Ingestion metadata, when this row was loaded into bronze.

      - name: rock_connection_opportunities
        description: Raw extract of Rock's ConnectionOpportunity table. One row per requestable opportunity.
        loaded_at_field: _loaded_at
        columns:
          - name: Id
            description: Rock's internal ID for the opportunity.
            tests:
              - unique
              - not_null
          - name: _loaded_at
            description: Ingestion metadata, when this row was loaded into bronze.

      - name: rock_analytics_dim_person_historical
        description: >
          Raw extract of Rock's AnalyticsDimPersonHistorical table, a
          slowly changing history of each person's attributes. One row per
          person per period.
        loaded_at_field: _loaded_at
        columns:
          - name: Id
            description: Surrogate key for this historical snapshot row.
            tests:
              - unique
              - not_null
          - name: PersonId
            description: The person this row describes. Repeats across rows for the same person.
          - name: CurrentRowIndicator
            description: True if this row is the person's current state.
          - name: _loaded_at
            description: Ingestion metadata, when this row was loaded into bronze.