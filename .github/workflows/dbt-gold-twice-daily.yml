name: dbt gold - twice daily build

on:
  schedule:
    - cron: '0 4,16 * * *'
  workflow_dispatch: {}     # lets you run it by hand from the Actions tab

# Never run two builds at once: a slow run would otherwise overlap the next one
# and both would write to the same gold tables.
concurrency:
  group: dbt-gold-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: analytics/requirements.txt

      - name: Install dbt
        run: pip install -r analytics/requirements.txt

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      # The profile name has to match the `profile:` line in dbt_project.yml,
      # so read it from there instead of hardcoding it. Authentication uses the
      # credentials file the step above set up (method: oauth).
      - name: Write dbt profile
        run: |
          PROFILE=$(grep -E "^profile:" analytics/dbt_project.yml | sed -E "s/^profile:[[:space:]]*['\"]?([^'\"[:space:]]+)['\"]?.*/\1/")
          echo "Using dbt profile: $PROFILE"
          mkdir -p "$RUNNER_TEMP/dbt"
          cat > "$RUNNER_TEMP/dbt/profiles.yml" <<EOF
          ${PROFILE}:
            target: ci
            outputs:
              ci:
                type: bigquery
                method: oauth
                project: bigquery-test-469018
                dataset: gold
                location: us-east1
                threads: 4
          EOF

      # Builds the gold models and their tests in dependency order. Silver
      # models are views, so they always read current bronze data and do not
      # need rebuilding. A failing test stops the models that depend on it, so
      # gold keeps its last good version instead of publishing bad data.
      - name: Build gold models
        working-directory: analytics
        env:
          DBT_PROFILES_DIR: ${{ runner.temp }}/dbt
        run: dbt build --select path:models/gold
