name: Rock Person - Delete Reconciliation

on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC = 7:00 AM Eastern, one hour after the incremental load
  workflow_dispatch: {}

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SQL Server ODBC driver
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /usr/share/keyrings/microsoft-prod.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/22.04/prod jammy main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          ACCEPT_EULA=Y sudo apt-get install -y msodbcsql18 unixodbc-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install pyodbc pandas google-cloud-bigquery db-dtypes

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Run loader
        env:
          ROCK_DB_SERVER: 8.232.178.116,1433
          ROCK_DB_NAME: ${{ secrets.ROCK_DB_NAME }}
          ROCK_DB_USER: ${{ secrets.ROCK_DB_USER }}
          ROCK_DB_PASSWORD: ${{ secrets.ROCK_DB_PASSWORD }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          BQ_BRONZE_DATASET: bronze
        run: python analytics/dbt/ingestion/load_rock_to_bigquery.py --table person --mode incremental --reconcile-deletes