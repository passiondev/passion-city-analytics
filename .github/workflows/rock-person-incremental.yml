name: Rock Person - Incremental Load

on:
  schedule:
    - cron: '0 10 * * *'   # 10:00 UTC = 6:00 AM Eastern (adjust if DST matters to you)
  workflow_dispatch: {}     # lets you trigger this manually from the Actions tab

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SQL Server ODBC driver
        run: |
          curl -sSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /usr/share/keyrings/microsoft-prod.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/22.04/prod jammy main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          ACCEPT_EULA=Y sudo apt-get install -y msodbcsql18 unixodbc-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install pyodbc pandas google-cloud-bigquery db-dtypes

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Start proxy and run loader
        env:
          ROCK_DB_SERVER: 127.0.0.1,1433
          ROCK_DB_NAME: ${{ secrets.ROCK_DB_NAME }}
          ROCK_DB_USER: ${{ secrets.ROCK_DB_USER }}
          ROCK_DB_PASSWORD: ${{ secrets.ROCK_DB_PASSWORD }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          BQ_BRONZE_DATASET: bronze
        run: |
          curl -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 1433 "${{ secrets.CLOUDSQL_INSTANCE_CONNECTION_NAME }}" > proxy.log 2>&1 &
          PROXY_PID=$!

          echo "Waiting for proxy to be ready..."
          for i in $(seq 1 15); do
            if grep -q "Listening on" proxy.log 2>/dev/null; then
              echo "Proxy is ready"
              break
            fi
            sleep 1
          done
          cat proxy.log

          python analytics/dbt/ingestion/load_rock_to_bigquery.py --table person --mode incremental
          LOADER_EXIT=$?

          kill $PROXY_PID 2>/dev/null || true
          exit $LOADER_EXIT