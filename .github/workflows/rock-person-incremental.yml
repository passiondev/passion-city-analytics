name: Rock Person - Incremental Load

on:
  schedule:
    - cron: '0 10 * * *'   # 10:00 UTC = 6:00 AM Eastern (adjust if DST matters to you)
  workflow_dispatch: {}     # lets you trigger this manually from the Actions tab

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install "cloud-sql-python-connector[pytds]" pandas google-cloud-bigquery db-dtypes

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Run loader
        env:
          CLOUDSQL_INSTANCE_CONNECTION_NAME: ${{ secrets.CLOUDSQL_INSTANCE_CONNECTION_NAME }}
          ROCK_DB_NAME: ${{ secrets.ROCK_DB_NAME }}
          ROCK_DB_USER: ${{ secrets.ROCK_DB_USER }}
          ROCK_DB_PASSWORD: ${{ secrets.ROCK_DB_PASSWORD }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          BQ_BRONZE_DATASET: bronze
        run: python analytics/dbt/ingestion/load_rock_to_bigquery.py --table person --mode incremental